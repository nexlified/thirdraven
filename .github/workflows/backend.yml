name: Backend

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thirdraven
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: thirdraven_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: cd backend && uv sync --group dev

      - name: Lint
        run: cd backend && uv run ruff check .

      - name: Run tests
        run: cd backend && uv run pytest --tb=short -q
        env:
          DATABASE_URL: postgresql+asyncpg://thirdraven:secret@localhost:5432/thirdraven_db
          SECRET_KEY: test-secret-key
